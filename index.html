```html
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direk Ölçüm - Sesli Deneme</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 18px;
      background: #f4f6f8;
      color: #202124;
    }
    h2 { margin-top: 0; }
    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }
    input, textarea, button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
    }
    input, textarea {
      border: 1px solid #bbb;
      background: white;
    }
    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
      margin-top: 12px;
      min-height: 48px;
    }
    #mikrofon { background: #1769aa; color: white; }
    #durdur { background: #ddd; color: #222; }
    #durum {
      padding: 12px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h2>Direk Ölçüm — Sesli Deneme</h2>
  <p>Ölçümleri tek seferde veya parça parça söyle. Kaydetmeden önce alanları kontrol et.</p>

  <button type="button" id="mikrofon">🎤 Konuşmaya Başla</button>
  <button type="button" id="durdur" disabled>Konuşmayı Durdur</button>

  <label for="direk">Direk No</label>
  <input id="direk" placeholder="Örn. 125-7">

  <label for="sicaklik">Hava Sıcaklığı (°C)</label>
  <input id="sicaklik" inputmode="decimal" placeholder="Örn. 17">

  <label for="yagis">Yağış Durumu</label>
  <input id="yagis" placeholder="Örn. Yok">

  <label for="yukseklik">Yeni Yükseklik</label>
  <input id="yukseklik" inputmode="decimal" placeholder="Örn. 5,45">

  <label for="dezeksman">DEZEKSMAN</label>
  <input id="dezeksman" inputmode="decimal" placeholder="Örn. 5,45">

  <label for="konusma">Tanınan konuşma</label>
  <textarea id="konusma" rows="4"></textarea>

  <div id="durum" role="status" aria-live="polite">Sayfa hazır.</div>

<script>
(function () {
  const el = id => document.getElementById(id);
  const baslat = el('mikrofon');
  const durdur = el('durdur');
  const durum = el('durum');

  let tanima = null;
  let dinleniyor = false;
  let oturumNo = 0;
  let sonMetin = '';

  function mesaj(yazi) {
    durum.textContent = yazi;
  }

  function alanDoldur(id, deger) {
    if (deger !== null && deger !== undefined && deger !== '') {
      el(id).value = deger;
    }
  }

  // Konuşma tanımanın farklı kelimelerle algıladığı ifadeleri düzelt.
  function metniNormalizeEt(metin) {
    return metin
      .toLocaleLowerCase('tr-TR')
      .replace(/\bdirekt\b/g, 'direk')
      .replace(/\bdilek\b/g, 'direk')

      // DEZEKSMAN için alternatif konuşma tanımaları.
      .replace(/\b(?:dex\s*man|dexman)\b/g, 'dezeksman')
      .replace(/\b(?:tezeksman|tezeksman|dezeksman)\b/g, 'dezeksman')
      .replace(/\b(?:dezek|dezeg|desek|dizek|deek|tezek)\b/g, 'dezeksman')
      .replace(/\b(?:zigzag|zikzak|zig\s*zag)\b/g, 'dezeksman')

      .replace(/[’']/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function turkceSayiyiCoz(metin) {
    const birler = {
      'sıfır': 0, 'bir': 1, 'iki': 2, 'üç': 3, 'dört': 4,
      'beş': 5, 'altı': 6, 'yedi': 7, 'sekiz': 8, 'dokuz': 9
    };
    const onlar = {
      'on': 10, 'yirmi': 20, 'otuz': 30, 'kırk': 40,
      'elli': 50, 'altmış': 60, 'yetmiş': 70,
      'seksen': 80, 'doksan': 90
    };

    const kelimeler = metniNormalizeEt(metin)
      .replace(/[.,!?;:]/g, ' ')
      .trim().split(/\s+/);

    let toplam = 0;
    let mevcut = 0;
    let bulundu = false;

    for (const kelime of kelimeler) {
      if (Object.prototype.hasOwnProperty.call(birler, kelime)) {
        mevcut += birler[kelime];
        bulundu = true;
      } else if (Object.prototype.hasOwnProperty.call(onlar, kelime)) {
        mevcut += onlar[kelime];
        bulundu = true;
      } else if (kelime === 'yüz') {
        mevcut = (mevcut || 1) * 100;
        bulundu = true;
      } else if (kelime === 'bin') {
        toplam += (mevcut || 1) * 1000;
        mevcut = 0;
        bulundu = true;
      } else {
        return null;
      }
    }

    return bulundu ? toplam + mevcut : null;
  }

  function sonrakiEtiketeKadar(metin, baslangic) {
    const kalan = metin.slice(baslangic);
    const etiket =
      /\b(?:direk|hava\s*sıcaklığı|sıcaklık|yağış(?:\s*durumu)?|yeni\s*yükseklik|yükseklik|dezeksman)\b/i;
    const m = etiket.exec(kalan);
    return m ? kalan.slice(0, m.index).trim() : kalan.trim();
  }

  function direkNumarasiniBul(metin) {
    const t = metniNormalizeEt(metin);
    const etiket = /\bdirek\s*(?:no|numarası|numara)?\s*/gi;
    let etiketli;
    let sonDirek = null;

    while ((etiketli = etiket.exec(t)) !== null) {
      const bolum = sonrakiEtiketeKadar(
        t,
        etiketli.index + etiketli[0].length
      );

      let m = bolum.match(
        /^(\d+)\s*(?:[-.]|tire|çizgi|t|te)\s*(\d+)/i
      );

      if (m) {
        sonDirek = m[1] + '-' + m[2];
        continue;
      }

      m = bolum.match(/^(.+?)\s+(?:tire|çizgi)\s+(.+)$/i);
      if (m) {
        const ana = turkceSayiyiCoz(m[1]);
        const ek = turkceSayiyiCoz(m[2]);
        if (ana !== null && ek !== null) {
          sonDirek = ana + '-' + ek;
          continue;
        }
      }

      m = bolum.match(/^(\d+)/);
      if (m) sonDirek = m[1];
    }

    return sonDirek;
  }

  function ondalikliDegeriBul(metin) {
    const t = metniNormalizeEt(metin);

    // 5.95, 5,95, 5 nokta 95, 5 virgül 95
    let m = t.match(
      /\b(\d+)\s*(?:[.,]\s*(\d+)|(?:virgül|nokta)\s+(\d+))\b/i
    );
    if (m) return m[1] + ',' + (m[2] || m[3]);

    // "5 475" -> 5,475
    m = t.match(/\b(\d)\s+(\d{3})\b/);
    if (m) return m[1] + ',' + m[2];

    // "5365" -> 5,365 (yükseklik/ölçüm biçimi)
    m = t.match(/\b(5)(\d{3})\b/);
    if (m) return m[1] + ',' + m[2];

    // "5 65" -> 5,65
    m = t.match(/\b(\d)\s+(\d{2})\b/);
    if (m) return m[1] + ',' + m[2];

    // "5 3 5" -> 5,35
    m = t.match(/\b(\d)\s+(\d)\s+(\d)\b/);
    if (m) return m[1] + ',' + m[2] + m[3];

    m = t.match(/\b(\d+)\b/);
    return m ? m[1] : null;
  }

  function etiketliSonOndalik(metin, etiketDeseni) {
    const etiket = new RegExp(etiketDeseni, 'gi');
    let eslesme;
    let sonDeger = null;

    while ((eslesme = etiket.exec(metin)) !== null) {
      const bolum = sonrakiEtiketeKadar(
        metin,
        eslesme.index + eslesme[0].length
      );

      const deger = ondalikliDegeriBul(bolum);

      if (deger !== null) {
        sonDeger = deger;
      }
    }

    return sonDeger;
  }

  function tumAlanlariGuncelle(metin) {
    const t = metniNormalizeEt(metin);
    let m;

    // Direk No: son söylenen geçerli numara.
    const direkNo = direkNumarasiniBul(t);
    if (direkNo !== null) alanDoldur('direk', direkNo);

    // Sıcaklık: son söylenen geçerli değer.
    const sicaklikEtiketi =
      /\b(?:hava\s*)?sıcaklık(?:\s*derece)?\s*/gi;
    let s;
    let sonSicaklik = null;

    while ((s = sicaklikEtiketi.exec(t)) !== null) {
      const bolum = sonrakiEtiketeKadar(t, s.index + s[0].length);
      m = bolum.match(/^(eksi\s*)?(\d+(?:[,.]\d+)?)/i);
      if (m) {
        sonSicaklik = (m[1] ? '-' : '') + m[2].replace(',', '.');
      }
    }

    if (sonSicaklik !== null) {
      alanDoldur('sicaklik', sonSicaklik.replace('.', ','));
    }

    // Yağış: son söylenen geçerli durum.
    const yagisEtiketi = /\byağış(?:\s*durumu)?\s*/gi;
    let y;
    let sonYagis = null;

    while ((y = yagisEtiketi.exec(t)) !== null) {
      const bolum = sonrakiEtiketeKadar(t, y.index + y[0].length);
      m = bolum.match(
        /^(yoktur|yok|yağmurlu|yağmur|yağışlı|var|karlı|kar|sisli|0|1)\b/i
      );
      if (m) {
        sonYagis = m[1] === 'yoktur' ? 'yok' : m[1];
      }
    }

    if (sonYagis !== null) alanDoldur('yagis', sonYagis);

    // Yükseklik: son söylenen geçerli değer.
    const sonYukseklik = etiketliSonOndalik(
      t,
      '\\b(?:yeni\\s*)?yükseklik\\s*'
    );
    if (sonYukseklik !== null) {
      alanDoldur('yukseklik', sonYukseklik);
    }

    // DEZEKSMAN: tüm alternatif ifadeler aynı etikete dönüştürülür.
    const sonDezeksman = etiketliSonOndalik(
      t,
      '\\bdezeksman\\s*'
    );
    if (sonDezeksman !== null) {
      alanDoldur('dezeksman', sonDezeksman);
    }
  }

  baslat.addEventListener('click', function () {
    if (dinleniyor) {
      mesaj('Mikrofon zaten açık.');
      return;
    }

    el('konusma').value = '';
    sonMetin = '';
    oturumNo++;
    const buOturum = oturumNo;

    mesaj('Tarayıcı desteği kontrol ediliyor...');

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      mesaj('Bu tarayıcı sesli konuşma tanımayı desteklemiyor. Güncel Chrome ile deneyin.');
      return;
    }

    try {
      tanima = new SpeechRecognition();
      tanima.lang = 'tr-TR';
      tanima.continuous = true;
      tanima.interimResults = true;

      tanima.onstart = function () {
        if (buOturum !== oturumNo) return;
        dinleniyor = true;
        baslat.disabled = true;
        durdur.disabled = false;
        mesaj('Mikrofon açık. Ölçümleri söyleyebilirsiniz.');
      };

      tanima.onresult = function (event) {
        if (buOturum !== oturumNo) return;

        let metin = '';
        for (let i = 0; i < event.results.length; i++) {
          metin += event.results[i][0].transcript + ' ';
        }

        metin = metin.trim();

        // Görüntülenen metinde de alternatif ifadeleri standartlaştır.
        const duzeltilmisMetin = metniNormalizeEt(metin);

        el('konusma').value = duzeltilmisMetin;

        if (duzeltilmisMetin !== sonMetin) {
          sonMetin = duzeltilmisMetin;
          tumAlanlariGuncelle(duzeltilmisMetin);
        }

        mesaj('Konuşma algılanıyor. Alanları kontrol edin.');
      };

      tanima.onerror = function (event) {
        if (buOturum !== oturumNo) return;
        mesaj('MİKROFON HATASI: ' + event.error);
      };

      tanima.onend = function () {
        if (buOturum !== oturumNo) return;
        dinleniyor = false;
        baslat.disabled = false;
        durdur.disabled = true;
      };

      mesaj('Mikrofon başlatılıyor...');
      tanima.start();
    } catch (hata) {
      dinleniyor = false;
      baslat.disabled = false;
      durdur.disabled = true;
      mesaj('BAŞLATMA HATASI: ' + hata.message);
    }
  });

  durdur.addEventListener('click', function () {
    if (tanima && dinleniyor) {
      mesaj('Dinleme durduruluyor...');
      tanima.stop();
    }
  });

  mesaj('JavaScript çalışıyor. Mikrofon testine hazır.');
})();
</script>
</body>
</html>
