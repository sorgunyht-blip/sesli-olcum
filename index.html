<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direk Ölçüm - Sesli Deneme</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 18px;
  background: #f4f6f8;
  color: #202124;
}

h2 { margin-top: 0; }

label {
  display: block;
  font-weight: bold;
  margin: 14px 0 6px;
}

input, textarea, button {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border-radius: 8px;
}

input, textarea {
  border: 1px solid #bbb;
  background: white;
}

button {
  border: 0;
  cursor: pointer;
  font-weight: bold;
  margin-top: 12px;
  min-height: 48px;
}

#mikrofon {
  background: #1769aa;
  color: white;
}

#durdur {
  background: #ddd;
  color: #222;
}

#durum {
  padding: 12px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin-top: 14px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}
</style>
</head>

<body>

<h2>Direk Ölçüm — Sesli Deneme</h2>

<p>
Ölçümleri tek seferde veya parça parça söyle.
Kaydetmeden önce alanları kontrol et.
</p>

<button type="button" id="mikrofon">🎤 Konuşmaya Başla</button>
<button type="button" id="durdur" disabled>Konuşmayı Durdur</button>

<label for="direk">Direk No</label>
<input id="direk" placeholder="Örn. 205-290">

<label for="sicaklik">Hava Sıcaklığı (°C)</label>
<input id="sicaklik" inputmode="decimal" placeholder="Örn. 17">

<label for="yagis">Yağış Durumu</label>
<input id="yagis" placeholder="Örn. Yok">

<label for="yukseklik">Yeni Yükseklik</label>
<input id="yukseklik" inputmode="decimal" placeholder="Örn. 5,45">

<label for="dezeksman">DEZEKSMAN</label>
<input id="dezeksman" inputmode="decimal" placeholder="Örn. 20,1">

<label for="konusma">Tanınan konuşma</label>
<textarea id="konusma" rows="5"></textarea>

<div id="durum" role="status" aria-live="polite">
Sayfa hazır.
</div>

<script>
(function () {
  const el = id => document.getElementById(id);
  const baslat = el('mikrofon');
  const durdur = el('durdur');
  const durum = el('durum');

  let tanima = null;
  let dinleniyor = false;
  let oturumNo = 0;
  let sonMetin = '';

  // Yeni özellik: kullanıcı durdurmadığı sürece yeniden dinle.
  let kullaniciDurdurdu = true;
  let yenidenBaslatZamanlayici = null;
  let kaliciHata = false;
  let yenidenBaslatDenemesi = false;

  function mesaj(yazi) {
    durum.textContent = yazi;
  }

  function zamanlayiciyiTemizle() {
    if (yenidenBaslatZamanlayici !== null) {
      clearTimeout(yenidenBaslatZamanlayici);
      yenidenBaslatZamanlayici = null;
    }
  }

  function alanDoldur(id, deger) {
    if (deger !== null && deger !== undefined && deger !== '') {
      el(id).value = deger;
    }
  }

  /*
   * DEZEKSMAN kelimesinin ses tanıma tarafından
   * farklı biçimlerde yazılmasını düzeltir.
   */
  function dezeksmanDuzelt(metin) {
    let t = metin;

    t = t.replace(
      /\b(?:t\s*x|d\s*x|tx|dx|dex|deks|teks|tezek|tezeks|dezeks|rezeks|rezek|rex|ezex|eze|deek|deeks|dexs|dix|desek|dizek|dezek|dezeg|zig|zik)\s*(?:man|men)\b/gi,
      ' dezeksman '
    );

    t = t.replace(
      /\b(?:rezeksman|rezekman|rezeksmen|rezexman|rexman|tezeksman|tezeksmen|teksman|teksmen|deksman|deksmen|deeksman|deekman|dexsman|dexman|dxman|txman|ezexman|desekman|dizekman|dezekman|dezegman|tezekman|dezeksmen|dezeksman)\b/gi,
      ' dezeksman '
    );

    t = t.replace(
      /\b(?:zigzag|zikzak|zigzak|ziksak|zig\s*zag|zik\s*zak|zig\s*zak|zik\s*zag)\b/gi,
      ' dezeksman '
    );

    t = t.replace(
      /\b(?:dezek|dezeg|desek|dizek|deek|tezek|rezeks|rezek|deks|teks)\b/gi,
      ' dezeksman '
    );

    return t;
  }

  function metniNormalizeEt(metin) {
    let t = metin.toLocaleLowerCase('tr-TR');

    t = t
      .replace(/\bdirekt\b/g, 'direk')
      .replace(/\bdilek\b/g, 'direk')
      .replace(/[’']/g, '');

    t = dezeksmanDuzelt(t);

    return t
      .replace(/\s+/g, ' ')
      .trim();
  }

  /*
   * Etiketin başladığı yerden sonraki etiketin
   * başladığı yere kadar olan bölümü alır.
   */
  function sonrakiEtiketeKadar(metin, baslangic) {
    const kalan = metin.slice(baslangic);

    const etiket =
      /\b(?:direk(?:\s*(?:no|numarası|numara))?|hava\s*sıcaklığı|sıcaklık|yağış(?:\s*durumu)?|yeni\s*yükseklik|yükseklik|dezeksman)\b/i;

    const m = etiket.exec(kalan);

    return m
      ? kalan.slice(0, m.index).trim()
      : kalan.trim();
  }

  /*
   * Direk numarasını bulur.
   * Örnek: 245-6, 245.6, 245 tire 6.
   */
  function direkNumarasiniBul(metin) {
    const t = metniNormalizeEt(metin);
    const etiket = /\bdirek\s*(?:no|numarası|numara)?\s*/gi;

    let eslesme;
    let sonDirek = null;

    while ((eslesme = etiket.exec(t)) !== null) {
      const bolum = sonrakiEtiketeKadar(
        t,
        eslesme.index + eslesme[0].length
      );

      let m = bolum.match(
        /^(\d+)\s*(?:[-.]|tire|çizgi|t|te)\s*(\d+)/i
      );

      if (m) {
        sonDirek = m[1] + '-' + m[2];
        continue;
      }

      m = bolum.match(/^(\d+)/);

      if (m) {
        sonDirek = m[1];
      }
    }

    return sonDirek;
  }

  /*
   * Ondalıklı sayıları bulur:
   * 5.35, 5,35, 5 virgül 35, 5 nokta 35,
   * 5 35 ve 5 3 5.
   */
  function ondalikliDegeriBul(metin) {
    const t = metniNormalizeEt(metin);

    let m = t.match(
      /\b(\d+)\s*(?:[.,]\s*(\d+)|(?:virgül|nokta)\s+(\d+))\b/i
    );

    if (m) {
      return m[1] + ',' + (m[2] || m[3]);
    }

    m = t.match(/\b(\d{1,2})\s+(\d{2,3})\b/);

    if (m) {
      return m[1] + ',' + m[2];
    }

    m = t.match(/\b(\d)\s+(\d)\s+(\d)\b/);

    if (m) {
      return m[1] + ',' + m[2] + m[3];
    }

    m = t.match(/\b(\d+)\b/);

    return m ? m[1] : null;
  }

  function sonEtiketliDegeriBul(metin, etiketDeseni, sayisalMi) {
    const etiket = new RegExp(etiketDeseni, 'gi');

    let eslesme;
    let sonDeger = null;

    while ((eslesme = etiket.exec(metin)) !== null) {
      const baslangic = eslesme.index + eslesme[0].length;

      const bolum = sonrakiEtiketeKadar(
        metin,
        baslangic
      );

      let deger = null;

      if (sayisalMi) {
        deger = ondalikliDegeriBul(bolum);
      } else {
        deger = bolum;
      }

      if (deger !== null && deger !== '') {
        sonDeger = deger;
      }
    }

    return sonDeger;
  }

  function tumAlanlariGuncelle(metin) {
    const t = metniNormalizeEt(metin);

    // 1. Direk No
    const direkNo = direkNumarasiniBul(t);

    if (direkNo !== null) {
      alanDoldur('direk', direkNo);
    }

    // 2. Hava sıcaklığı
    const sicaklikEtiketi =
      /\b(?:hava\s*sıcaklığı|sıcaklık)\s*/gi;

    let s;
    let sonSicaklik = null;

    while ((s = sicaklikEtiketi.exec(t)) !== null) {
      const bolum = sonrakiEtiketeKadar(
        t,
        s.index + s[0].length
      );

      const m = bolum.match(
        /^(eksi\s*)?(\d+(?:[,.]\d+)?)(?:\s*(?:derece|santigrat))?/i
      );

      if (m) {
        sonSicaklik =
          (m[1] ? '-' : '') + m[2].replace('.', ',');
      }
    }

    if (sonSicaklik !== null) {
      alanDoldur('sicaklik', sonSicaklik);
    }

    // 3. Yağış durumu
    const yagisEtiketi = /\byağış(?:\s*durumu)?\s*/gi;

    let y;
    let sonYagis = null;

    while ((y = yagisEtiketi.exec(t)) !== null) {
      const bolum = sonrakiEtiketeKadar(
        t,
        y.index + y[0].length
      );

      const m = bolum.match(
        /^(yoktur|yok|yağmurlu|yağmur|yağışlı|var|karlı|kar|sisli|sil|0|1)\b/i
      );

      if (m) {
        let deger = m[1];

        if (deger === 'yoktur') {
          deger = 'yok';
        }

        if (deger !== 'sil') {
          sonYagis = deger;
        }
      }
    }

    if (sonYagis !== null) {
      alanDoldur('yagis', sonYagis);
    }

    // 4. Yeni Yükseklik
    const yukseklikEtiketi =
      /\b(?:yeni\s*)?yükseklik\s*/gi;

    let h;
    let sonYukseklik = null;

    while ((h = yukseklikEtiketi.exec(t)) !== null) {
      const bolum = sonrakiEtiketeKadar(
        t,
        h.index + h[0].length
      );

      const deger = ondalikliDegeriBul(bolum);

      if (deger !== null) {
        sonYukseklik = deger;
      }
    }

    if (sonYukseklik !== null) {
      alanDoldur('yukseklik', sonYukseklik);
    }

    // 5. DEZEKSMAN
    const dezeksmanEtiketi = /\bdezeksman\s*/gi;

    let d;
    let sonDezeksman = null;

    while ((d = dezeksmanEtiketi.exec(t)) !== null) {
      const bolum = sonrakiEtiketeKadar(
        t,
        d.index + d[0].length
      );

      const deger = ondalikliDegeriBul(bolum);

      if (deger !== null) {
        sonDezeksman = deger;
      }
    }

    if (sonDezeksman !== null) {
      alanDoldur('dezeksman', sonDezeksman);
    }
  }

  /*
   * Oturum sırasında hata oluşursa mesajı gösterir.
   * İzin ve mikrofon erişimi gibi kalıcı hatalarda
   * otomatik yeniden başlatmayı durdurur.
   */
  function hataKaliciMi(hata) {
    return [
      'not-allowed',
      'service-not-allowed',
      'audio-capture'
    ].includes(hata);
  }

  function otomatikYenidenDinle(buOturum) {
    zamanlayiciyiTemizle();

    if (
      buOturum !== oturumNo ||
      kullaniciDurdurdu ||
      kaliciHata ||
      !tanima
    ) {
      return;
    }

    yenidenBaslatZamanlayici = setTimeout(function () {
      yenidenBaslatZamanlayici = null;

      if (
        buOturum !== oturumNo ||
        kullaniciDurdurdu ||
        kaliciHata ||
        !tanima
      ) {
        return;
      }

      try {
        yenidenBaslatDenemesi = true;
        mesaj('Dinleme yeniden başlatılıyor...');
        tanima.start();
      } catch (hata) {
        yenidenBaslatDenemesi = false;
        dinleniyor = false;

        /*
         * Tarayıcı yeniden başlatmaya henüz hazır değilse
         * kısa bir süre sonra tekrar dene.
         */
        otomatikYenidenDinle(buOturum);
      }
    }, 500);
  }

  baslat.addEventListener('click', function () {
    if (dinleniyor) {
      mesaj('Mikrofon zaten açık.');
      return;
    }

    zamanlayiciyiTemizle();

    el('konusma').value = '';
    sonMetin = '';

    kullaniciDurdurdu = false;
    kaliciHata = false;
    yenidenBaslatDenemesi = false;

    oturumNo++;
    const buOturum = oturumNo;

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      kullaniciDurdurdu = true;

      mesaj(
        'Bu tarayıcı sesli konuşma tanımayı desteklemiyor. Güncel Chrome ile deneyin.'
      );

      return;
    }

    try {
      tanima = new SpeechRecognition();

      tanima.lang = 'tr-TR';
      tanima.continuous = true;
      tanima.interimResults = true;

      tanima.onstart = function () {
        if (buOturum !== oturumNo) return;

        yenidenBaslatDenemesi = false;
        dinleniyor = true;

        baslat.disabled = true;
        durdur.disabled = false;

        mesaj(
          'Mikrofon açık. Ölçümleri söyleyebilirsiniz.'
        );
      };

      tanima.onresult = function (event) {
        if (buOturum !== oturumNo) return;

        let metin = '';

        for (let i = 0; i < event.results.length; i++) {
          metin += event.results[i][0].transcript + ' ';
        }

        metin = metin.trim();

        const duzeltilmisMetin =
          metniNormalizeEt(metin);

        el('konusma').value = duzeltilmisMetin;

        if (duzeltilmisMetin !== sonMetin) {
          sonMetin = duzeltilmisMetin;
          tumAlanlariGuncelle(duzeltilmisMetin);
        }

        mesaj('Konuşma algılanıyor. Alanları kontrol edin.');
      };

      tanima.onerror = function (event) {
        if (buOturum !== oturumNo) return;

        mesaj('MİKROFON HATASI: ' + event.error);

        if (hataKaliciMi(event.error)) {
          kaliciHata = true;
          kullaniciDurdurdu = true;
          zamanlayiciyiTemizle();

          dinleniyor = false;
          baslat.disabled = false;
          durdur.disabled = true;
        }
      };

      tanima.onend = function () {
        if (buOturum !== oturumNo) return;

        dinleniyor = false;

        if (kullaniciDurdurdu || kaliciHata) {
          zamanlayiciyiTemizle();

          baslat.disabled = false;
          durdur.disabled = true;

          if (kullaniciDurdurdu) {
            mesaj('Dinleme durduruldu.');
          }

          return;
        }

        /*
         * Mobil tarayıcı kısa sessizlikten sonra
         * tanımayı bitirirse otomatik yeniden başlat.
         * Konuşma alanını ve ölçüm alanlarını temizleme.
         */
        baslat.disabled = true;
        durdur.disabled = false;

        mesaj(
          'Kısa sessizlik algılandı. Dinleme otomatik yeniden başlatılacak...'
        );

        otomatikYenidenDinle(buOturum);
      };

      mesaj('Mikrofon başlatılıyor...');
      tanima.start();

    } catch (hata) {
      dinleniyor = false;
      kullaniciDurdurdu = true;

      baslat.disabled = false;
      durdur.disabled = true;

      mesaj('BAŞLATMA HATASI: ' + hata.message);
    }
  });

  durdur.addEventListener('click', function () {
    /*
     * Kullanıcı elle durdurduğunda yeniden başlatma
     * zamanlayıcısını iptal et.
     */
    kullaniciDurdurdu = true;
    zamanlayiciyiTemizle();

    if (tanima) {
      try {
        tanima.stop();
      } catch (hata) {
        // Tanıma zaten durmuşsa hata oluşmasını engelle.
      }
    }

    dinleniyor = false;
    baslat.disabled = false;
    durdur.disabled = true;

    mesaj('Dinleme durduruldu.');
  });

  mesaj('JavaScript çalışıyor. Mikrofon testine hazır.');
})();
</script>

</body>
</html>
